name: Daten aktualisieren und auf GitHub Pages veröffentlichen

# Jeden Montag früh: Fördersätze (Bundesnetzagentur), Strompreis (Eurostat), Börsenpreise (SMARD) und
# Registerzahlen (Marktstammdatenregister) neu laden, Tests laufen lassen, neu bauen und veröffentlichen.
# Keine Zugangsdaten nötig: alle Quellen sind offen.
on:
  push:
    branches: ['main']
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Daten neu laden (nur beim Zeitplan oder von Hand)
        if: github.event_name != 'push'
        run: |
          pip install openpyxl
          python3 scripts/data/fetch-eeg.py
          python3 scripts/data/fetch-strompreis.py
          python3 scripts/data/fetch-smard.py && cp research/smard.json src/data/smard.json
          python3 scripts/data/fetch-mastr.py && python3 scripts/data/build-standort.py
      - name: Geänderte Daten festhalten
        if: github.event_name != 'push'
        run: |
          git config user.name "solarrechnen-daten"
          git config user.email "actions@users.noreply.github.com"
          git add src/data research/mastr.json research/smard.json research/bnetza
          git diff --cached --quiet || (git commit -m "Daten: Fördersätze, Strompreis, SMARD und Register aktualisiert" && git push)
      - run: npm ci
      - name: Tests (Motor und Seiten)
        run: npx vitest run
      - name: Build (mit Kontrolle der Snippets)
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout (script IndexNow)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
      - name: Ping IndexNow
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: bash scripts/indexnow.sh https://solarrechnen.de
